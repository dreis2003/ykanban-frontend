name: Build and publish frontend image

on:
  push:
    branches:
      - hml
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dreis2003/ykanban-frontend

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Resolve environment settings
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "prefix=prd" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=hml" >> "$GITHUB_OUTPUT"
          fi
          # A API é servida pelo mesmo domínio via Ingress (/api -> ykanban-api),
          # então o frontend deve chamar sempre um caminho relativo, nunca um
          # subdomínio separado — evita CORS e mismatch de host entre ambientes.
          echo "api_base_url=/api/v1" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ steps.env.outputs.api_base_url }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.env.outputs.prefix }}-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.env.outputs.prefix }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
